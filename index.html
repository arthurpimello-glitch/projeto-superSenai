<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assisti?</title>
</head>
<body>
    <main>
        <img id="imagem" src="/assisti.png" alt="">
        <div id="caixa">
            <div id="cadastro"> 
                <h2>Cadastro</h2>
                <input type="text" id="usuarioCadastro" placeholder="Usuario">
                <input type="email" id="emailCadastro" placeholder="E-mail">
                <input type="password" id="senhaCadastro" placeholder="Senha">

                <button type="button" id="btnCadastrar">Cadastrar</button>
            </div>

            <div id="login"> 
                <h2>Login</h2>
                <input type="email" id="emailLogin" placeholder="E-mail">
                <input type="password" id="senhaLogin" placeholder="Senha">

                <button type="button" id="btnLogin">Login</button>
            </div>
        </div>
    </main>

    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/main.js"></script>
    <!---->
</body>
</html>
